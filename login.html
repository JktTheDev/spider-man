<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Spider-Man</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            width: 320px;
            box-shadow: 0 0 15px rgba(255,0,0,0.4);
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: none;
            border-radius: 4px;
        }

        .login-box button {
            width: 100%;
            padding: 10px;
            background: red;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .error {
            color: #ff6b6b;
            font-size: 0.8rem;
        }

        .success {
            color: lightgreen;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Spider-Man Login</h2>

        <form id="loginForm" novalidate>
            <input type="text" id="username" placeholder="Username">
            <small class="error" id="usernameError"></small>

            <input type="password" id="password" placeholder="Password">
            <small class="error" id="passwordError"></small>

            <button type="submit">Login</button>
            <p class="success" id="loginSuccess"></p>
        </form>
    </div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    let usernameError = document.getElementById("usernameError");
    let passwordError = document.getElementById("passwordError");
    let successMsg = document.getElementById("loginSuccess");

    // Clear previous messages
    usernameError.textContent = "";
    passwordError.textContent = "";
    successMsg.textContent = "";

    let isValid = true;

    // Username validation
    if (username === "") {
        usernameError.textContent = "Username is required";
        isValid = false;
    } else if (username.length < 4) {
        usernameError.textContent = "Username must be at least 4 characters";
        isValid = false;
    }

    // Password validation
    if (password === "") {
        passwordError.textContent = "Password is required";
        isValid = false;
    } else if (password.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters";
        isValid = false;
    }

    // If everything is valid
    if (isValid) {
        successMsg.textContent = "Login Successful!";
    }
});
</script>

</body>
</html>
